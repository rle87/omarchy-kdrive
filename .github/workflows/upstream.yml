name: Track kDrive upstream

# Weekly: move the upstream submodule to the newest kDrive version tag, regenerate
# StatusStrings.js and open a pull request with a compatibility report.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      - name: Find the newest upstream version tag
        id: tag
        run: |
          latest=$(git ls-remote --tags --refs https://github.com/Infomaniak/desktop-kDrive.git \
            | sed 's|.*refs/tags/||' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1)
          current=$(git -C upstream describe --tags --exact-match 2>/dev/null || git -C upstream rev-parse --short HEAD)
          echo "latest=$latest" >> "$GITHUB_OUTPUT"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          echo "Current: $current, latest: $latest"

      - name: Update submodule and regenerate strings
        if: steps.tag.outputs.latest != steps.tag.outputs.current
        id: update
        run: |
          git -C upstream fetch --depth 1 origin tag "${{ steps.tag.outputs.latest }}"
          git -C upstream checkout "${{ steps.tag.outputs.latest }}"
          set +e
          python3 tools/update-status-strings.py --report "$RUNNER_TEMP/report.md"
          echo "compatible=$([ $? -eq 0 ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - name: Open a pull request
        if: steps.tag.outputs.latest != steps.tag.outputs.current
        env:
          GH_TOKEN: ${{ github.token }}
          LATEST: ${{ steps.tag.outputs.latest }}
          CURRENT: ${{ steps.tag.outputs.current }}
          COMPATIBLE: ${{ steps.update.outputs.compatible }}
        run: |
          branch="upstream/$LATEST"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "Branch $branch already exists, nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add upstream StatusStrings.js
          git commit -m "Track kDrive upstream $LATEST"
          git push origin "$branch"
          title="kDrive upstream $LATEST"
          [ "$COMPATIBLE" = yes ] || title="⚠️ $title: tray status strings changed"
          {
            echo "Upstream moved from \`$CURRENT\` to \`$LATEST\`:"
            echo "https://github.com/Infomaniak/desktop-kDrive/compare/$CURRENT...$LATEST"
            echo
            cat "$RUNNER_TEMP/report.md"
          } > "$RUNNER_TEMP/body.md"
          gh pr create --base main --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/body.md"
